# macOS (Apple Silicon) 每次推送自动编译 BbQ
#
# 目标：把移植过程中的"编译期"问题在 CI 上收敛（Windows 本地无法验证
# 非 WIN 分支）。产物为未签名的 BbQ.app，自用场景首次打开需右键→打开。
#
# 依赖说明：
#   - Qt 6.9.3 clang_64（universal2，原生跑 ARM64；macos_arm64 arch 已不存在）
#     基础包含 qtbase/qtdeclarative/qtsvg/qttools；Multimedia/WebSockets/
#     ShaderTools/5Compat 为附加包需显式安装（已查 download.qt.io 6.9.3 元数据）
#   - libmpv 来自 Homebrew（brew install mpv，同时提供头文件与 dylib）
#   - FluentUI 从官方仓库拉取并安装进 Qt 的 qml 目录；若你有本地改动，
#     请改为 fork 固定或 vendored 子目录
#
# 已知限制：runner 无 GUI 会话，只能验证"编译通过 + bundle 生成"，
# 运行期行为（mpv 渲染、弹幕 vsync）必须真机联调

name: macOS Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}   # 允许手动触发

jobs:
  macos-arm64:
    runs-on: macos-14      # Apple Silicon (M1)；需要 Intel 版时改为 macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.9 (universal, runs native on ARM64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: 'clang_64'
          modules: 'qtshadertools qtmultimedia qtwebsockets qt5compat'
          cache: true

      # qmake 由 install-qt-action 加入 PATH；用 -query 拿权威安装路径，
      # 不依赖 action 的环境变量命名
      - name: Install libmpv & tools (Homebrew)
        run: |
          brew install mpv ninja
          echo "QT_PREFIX=$(qmake -query QT_INSTALL_PREFIX)" >> "$GITHUB_ENV"
          echo "QT_QML_DIR=$(qmake -query QT_INSTALL_QML)" >> "$GITHUB_ENV"

      # FluentUI 构建时把插件 dylib 直接链入 Qt 的 qml 目录，
      # 其 cmake install 规则默认指向 /usr/local/imports（无权限），
      # 因此跳过 install，改为校验插件目录完整性 + 缺 qmldir 时补拷
      - name: Build FluentUI
        run: |
          git clone --depth 1 https://github.com/zhuzichu520/FluentUI.git /tmp/FluentUI
          cmake -S /tmp/FluentUI -B /tmp/FluentUI/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DFLUENTUI_BUILD_EXAMPLES=OFF
          cmake --build /tmp/FluentUI/build --parallel
          echo "--- plugin dir contents:"
          ls -la "$QT_QML_DIR/FluentUI/" || true
          if [ ! -f "$QT_QML_DIR/FluentUI/qmldir" ]; then
            echo "qmldir missing in plugin dir, copying from build tree"
            find /tmp/FluentUI/build -name qmldir -exec cp {} "$QT_QML_DIR/FluentUI/" \;
          fi
          test -f "$QT_QML_DIR/FluentUI/qmldir" || { echo "ERROR: FluentUI qmldir not found"; exit 1; }

      - name: Configure (Release)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DFLUENTUI_QML_PATH="$QT_QML_DIR/FluentUI"

      - name: Build
        run: cmake --build build --parallel

      - name: Install bundle (BbQ.app)
        run: |
          cmake --install build --prefix "$PWD/stage"

      # 自签（ad-hoc）：不加也可用，但签名后本地首次放行的记录更稳定
      - name: Ad-hoc codesign
        run: |
          codesign --force --deep -s - "stage/BbQ.app" || true

      # libmpv 依赖较多 Homebrew dylib；自用机器装了 mpv 即可运行，
      # 这里不做 macdeployqt 全量打包，仅记录依赖清单供参考
      - name: List dynamic dependencies
        run: |
          otool -L "stage/BbQ.app/Contents/MacOS/BbQ" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BbQ-macOS-arm64
          path: stage/BbQ.app
          retention-days: 14
