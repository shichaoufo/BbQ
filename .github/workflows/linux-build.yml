# Linux (x64) 手动触发编译 BbQ（OpenGL RHI + libmpv render_gl 路径）
#
# 目标：把 Linux 移植的"编译期"问题在 CI 上收敛（Windows 本地完全无法验证
# 非 WIN 分支），并产出**两个**产物：
#   1) BbQ-Linux-x64.tar.gz —— 自包含免安装绿色版。Qt 运行库、QML 模块
#      （含 FluentUI）、libmpv 及其 ffmpeg 依赖全部内置，目标机只需具备
#      图形驱动（mesa/GL）与窗口系统（X11/Wayland）即可运行。
#   2) BbQ-Linux-amd64.deb —— 可安装的系统包。dpkg -i 后自带桌面图标、
#      开始菜单项与卸载入口，满足"像正常软件一样点击图标运行"的诉求。
#      运行时同样全部内置在 /opt/bbq，详见下方"Package .deb"步骤里的
#      Depends 权衡说明。
#
# 依赖说明：
#   - Qt 6.9.3 linux_gcc_64（aqtinstall / jurplel-install-qt-action）
#     与 macOS workflow 刻意保持同一版本，理由见下方"Qt 版本选择"注释
#   - libmpv 来自 Ubuntu 官方仓库（libmpv-dev 提供 mpv/client.h +
#     mpv/render_gl.h + libmpv.so.2）。CMakeLists 的 UNIX 分支用
#     find_library(mpv) 定位它；找不到只会 WARNING 并置 NO_MPV=1
#     （视频播放禁用），本 workflow 在 smoke test 里断言 libmpv 确实
#     进了 NEEDED，避免"编译通过但播不了"的假绿
#   - FluentUI 从官方仓库拉取并就地编入 Qt 的 qml 目录
#
# Qt 版本选择（为什么是 6.9.3 而不是 6.11.1）：
#   1) 源码用到的 private API 是 QSGTexture::commitTextureOperations(
#      QRhi*, QRhiResourceUpdateBatch*) 与 QRhi::newTexture()，其中
#      QRhiResourceUpdateBatch 自 Qt 6.6 起就是正式名字，且经比对
#      Qt 6.9.3 与 6.12 文档，该虚函数签名逐字一致——不构成版本约束。
#   2) CMakeLists 里 find_package(Qt6 REQUIRED COMPONENTS GuiPrivate)
#      对 6.9 与 6.11 均成立（官方二进制包都带 private 头与
#      GuiPrivate 的 cmake config），6.11 只是"不再隐式加载"而已。
#   3) macOS workflow 已在 6.9.3 上验证过同一份 CMakeLists + 同一份
#      源码的 UNIX 分支可编译，Linux 复用同一版本＝复用已验证结论。
#   4) aqtinstall 对 Qt 6.11 存在仓库目录结构不兼容（上游 #1007，
#      修复 PR #1000 仅覆盖到 win_x64），install-qt-action 内置的
#      aqt 版本未必带该修复。Windows workflow 为此专门绕开了
#      install-qt-action 手动装 PR 版 aqt；Linux 若同样锁 6.11 就必须
#      复制这套 workaround，徒增变量。6.9.3 无此问题。
#
# 已知限制：
#   - runner 无 GUI 会话（且刻意不引入 xvfb，见 smoke test 注释），
#     只能验证"编译通过 + 链接完整 + 打包完整"；OpenGL 渲染、mpv
#     帧回调、弹幕 vsync 等运行期行为必须真机联调。
#   - GStreamer 运行时**不内置**进tar 包：Qt6 Multimedia 的 gstreamer
#     后端体积大且版本敏感，而本项目视频播放走 libmpv，Qt Multimedia
#     仅被链接未实际使用（无 QMediaPlayer 调用）。目标机若无
#     GStreamer，Qt Multimedia 相关功能不可用，不影响 BbQ 主功能。
#   - .deb 与 tar.gz 均在 **glibc 2.35（Ubuntu 22.04）** 基线上编译。
#     glibc 向后兼容但**新符号只在新系统上**，因此产物保证 2.35+ 可运行。
#     ⚠️ 已知未覆盖：**银河麒麟 V10 是 glibc 2.31**（部分版本 2.28），
#     低于本产物门槛，dpkg 会因 `libc6 (>= 2.35)` 拒绝安装。
#     要真正覆盖麒麟 V10，需要把构建容器化到 CentOS 7 / older-2.28 基线
#     （或自行编译 Qt），当前 workflow 做不到——请勿对外承诺支持麒麟 V10。
#   - .deb 与 tar.gz 均**未在真实带 GUI 的 Linux 上运行验证过**，只做了
#     静态校验（ldd 闭包、文件存在性、权限位、图标尺寸）。首次在真机上
#     使用时请留意启动器是否弹窗。

name: Linux Build

on:
  workflow_dispatch: {}   # 仅手动触发：Actions 页面 → Linux Build → Run workflow

# 手动触发场景下同一分支可能连点多次，取消旧运行避免浪费配额
concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x64:
    # glibc 2.35（jammy）。这个版本号直接决定两个产物的运行门槛：
    # glibc 向后兼容但**新符号只在新系统上**，在 24.04（glibc 2.39）上编
    # 出的二进制在 glibc < 2.38 的系统上会报
    # "version `GLIBC_2.38' not found" 启动即退。
    # 下调到 22.04 是为了覆盖更老的国产 Linux（银河麒麟 V10 是 2.31）。
    # 注意：22.04 的 libmpv-dev 是 mpv 0.34.1（24.04 是 0.37+），
    # 本项目只用了 client.h/render_gl.h 的稳定 API，不受影响。
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 系统依赖 ----
      # libmpv-dev : mpv 头文件（client.h / render_gl.h）+ libmpv.so.2，
      #              UNIX 分支 find_library/find_path 命中它才算真正启用播放
      # zlib1g-dev: CMakeLists 里 target_link_libraries(... z)，弹幕压缩包 inflate
      # libgl*/libegl*/libopengl-dev:
      #              Qt6::OpenGL 的 cmake config 内部 find_package(OpenGL REQUIRED
      #              COMPONENTS ...)，缺 GL/EGL/GLX 开发符号会在 configure 阶段
      #              直接失败，是 REQUIRED 级依赖而非可选项
      # libxkbcommon-dev / libfontconfig1-dev:
      #              Qt6Gui 在 Linux 上探测 XKB / fontconfig，缺失会让
      #              Gui 的 cmake config 走降级分支
      # gstreamer*: Qt6 Multimedia 的运行期后端，纯运行期依赖——本项目
      #              视频走 mpv，编译期完全不需要，装它们只为让产物在
      #              常规桌面发行版上具备 Qt Multimedia 能力
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # DEBIAN_FRONTEND=noninteractive：防止某个包的 debconf 脚本弹
          # 交互式问答（如地区/locale 选择）把非交互式 runner 挂住。
          # 非必要，但加一条零成本。
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ninja-build \
            git \
            ca-certificates \
            libmpv-dev \
            zlib1g-dev \
            libgl1-mesa-dev \
            libegl-dev \
            libopengl-dev \
            libxkbcommon-dev \
            libfontconfig1-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      # 基础包已含 qtbase/qtdeclarative/qtsvg/qttools；下面 5 个是附加包：
      #   qtshadertools : ShaderTools（MultiEffect/FluWindow 亚克力效果）
      #   qtmultimedia  : Multimedia（REQUIRED 组件）
      #   qtwebsockets  : WebSockets（REQUIRED 组件，弹幕/评论长连接）
      #   qt5compat     : Core5Compat + Quick5Compat（可选组件，缺失只 WARNING
      #                   并关闭亚克力效果，故装上以对齐 Windows 的观感）
      #   qtimageformats: qwebp 等图片解码插件（B站动态图大量 webp）
      #
      # arch 必须是 linux_gcc_64 而非 gcc_64：Qt 6.9.3 的 Linux 桌面归档
      # 只有 linux_gcc_64 这一个架构名（aqt list-qt linux desktop --arch
      # 6.9.3 确认），写成 gcc_64 会在这一步报
      # "The packages [...] were not found while parsing XML"。
      # （install-qt-action README 里 Linux x64 的默认值写的是 gcc_64，
      #   但那是 6.8.x 的情况，6.9+ 已改名，不要照抄。）
      - name: Install Qt 6.9.3 (linux_gcc_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools qtmultimedia qtwebsockets qt5compat qtimageformats'
          cache: true

      # qmake 由 install-qt-action 加入 PATH；用 -query 拿权威安装路径，
      # 不依赖 action 的环境变量命名（Windows/macOS workflow 同一做法）
      - name: Verify toolchain
        run: |
          set -euo pipefail
          echo "--- compiler / cmake:"
          g++ --version | head -1
          cmake --version | head -1
          echo "--- libmpv:"
          pkg-config --modversion mpv 2>/dev/null || true
          ls -l /usr/lib/*/libmpv.so* 2>/dev/null || ls -l /usr/lib/libmpv.so* 2>/dev/null || true
          test -f /usr/include/mpv/render_gl.h
          echo "mpv/render_gl.h present"
          echo "--- Qt:"
          qmake -query QT_VERSION
          qmake -query QT_INSTALL_PREFIX
          qmake -query QT_INSTALL_QML
          echo "QT_PREFIX=$(qmake -query QT_INSTALL_PREFIX)" >> "$GITHUB_ENV"
          echo "QT_QML_DIR=$(qmake -query QT_INSTALL_QML)" >> "$GITHUB_ENV"

      # FluentUI 构建时把插件 so 直接链入 Qt 的 qml 目录，
      # 其 cmake install 规则默认指向无权限目录，因此跳过 install，
      # 改为校验插件目录完整性 + 缺 qmldir 时从 build 树补拷
      - name: Build FluentUI
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zhuzichu520/FluentUI.git "$RUNNER_TEMP/FluentUI"
          cmake -S "$RUNNER_TEMP/FluentUI" -B "$RUNNER_TEMP/FluentUI/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DFLUENTUI_BUILD_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/FluentUI/build" --parallel
          echo "--- plugin dir contents:"
          ls -la "$QT_QML_DIR/FluentUI/" || true
          if [ ! -f "$QT_QML_DIR/FluentUI/qmldir" ]; then
            echo "qmldir missing in plugin dir, copying from build tree"
            find "$RUNNER_TEMP/FluentUI/build" -name qmldir -exec cp {} "$QT_QML_DIR/FluentUI/" \;
          fi
          test -f "$QT_QML_DIR/FluentUI/qmldir" || { echo "ERROR: FluentUI qmldir not found"; exit 1; }

      # FLUENTUI_QML_PATH 的默认值 /usr/lib/qml/FluentUI 只适配部分发行版，
      # 必须用 -D 显式传入本机 Qt 的实际 qml 目录
      - name: Configure (Release)
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DFLUENTUI_QML_PATH="$QT_QML_DIR/FluentUI"

      - name: Build
        run: cmake --build build --parallel

      # Linux 无 bundle，install(TARGETS ... RUNTIME DESTINATION bin)
      # 直接产出裸可执行文件 stage/bin/BbQ
      - name: Install to staging
        run: cmake --install build --prefix "$PWD/stage"

      # runner 无 GUI 会话。这里刻意不加 xvfb：Xvfb + llvmpipe 软件渲染
      # 会引入与真实驱动不同的行为，且 BbQ 启动即发起网络请求与登录态
      # 恢复，既不稳定也不代表真机表现——那样的"跑起来了"是假信号。
      # 这里只做与运行期无关、但能真正暴露问题的静态校验。
      - name: Smoke test (static)
        run: |
          set -euo pipefail
          BIN="stage/bin/BbQ"
          test -x "$BIN" || { echo "ERROR: $BIN missing or not executable"; exit 1; }

          echo "--- file type:"
          file "$BIN"

          echo "--- NEEDED entries:"
          readelf -d "$BIN" | grep NEEDED || true

          # ldd 出现 "not found" 说明链接闭包有缺口。
          # ⚠️ 但这条检查在 runner 上是**弱校验（近似假绿）**，必须如实理解：
          # runner 预装了全套 X11/xcb 图形栈（我们上面还主动装了
          # libgl1-mesa-dev / libxkbcommon-dev / gstreamer 等一整套开发包），
          # 所以 ldd 在 runner 上几乎必然全绿，**无法证明目标机上不缺库**。
          # 真正会缺库的是两类：
          #   1) Qt xcb 平台插件在运行时 dlopen 的依赖（libxcb-cursor0 等）——
          #      这些不在主程序的 NEEDED 里，ldd 主程序根本看不到；
          #   2) 精简系统上未装的图形/字体栈。
          # 这类缺失的典型症状是"dpkg 装成功、桌面图标出现、点开窗口不出现"
          #（Qt 平台插件加载失败后静默退出）。因此它们必须写进 deb 的
          # Depends 显式声明（见 Package .deb），而不能指望 ldd 拦下来。
          echo "--- ldd:"
          ldd "$BIN" | tee /tmp/ldd.txt
          if grep -q "not found" /tmp/ldd.txt; then
            echo "ERROR: unresolved dynamic dependencies"; exit 1
          fi

          # 断言走的是 OpenGL + libmpv 路径而非降级：
          #   NO_MPV=1 时 CMake 不链 libmpv，ldd 里就不会出现 libmpv
          #   Qt6::OpenGL 是 REQUIRED 组件，缺失则 configure 早已失败
          # 注：ldd 展示的是完整传递闭包，libQt6OpenGL 由 libQt6Gui 传递
          # 引入；本项目直接使用的 QOpenGLContext/FBO/Functions 在 Qt6 中
          # 归属 Qt6::Gui。此断言的目的是确认 OpenGL 栈在位。
          grep -q "libmpv" /tmp/ldd.txt || {
            echo "ERROR: libmpv not linked -- CMake fell back to NO_MPV=1 (video disabled)"; exit 1; }
          grep -q "libQt6OpenGL" /tmp/ldd.txt || {
            echo "ERROR: libQt6OpenGL not in link closure"; exit 1; }
          grep -q "libQt6Quick" /tmp/ldd.txt || {
            echo "ERROR: libQt6Quick not linked"; exit 1; }

          # 产物体积 sanity check：Qt 静态资源（qrc）缺失会缩到几 MB
          SIZE=$(stat -c %s "$BIN")
          echo "--- binary size: $SIZE bytes"
          if [ "$SIZE" -lt 2000000 ]; then
            echo "ERROR: binary suspiciously small, QML resources may be missing"; exit 1
          fi

          # 项目从未调用 enable_testing()，CMake 不会生成 CTestTestfile.cmake，
          # 此时 ctest 自身会因找不到该文件而报错退出。必须以文件是否存在
          # 来判断有无测试——若改用 `ctest -N | grep "Total Tests: 0"` 判断，
          # ctest 找不到文件时 stdout 无匹配 → 守卫失效 → 走进 else 分支
          # 真去跑 ctest → 因无测试文件而非零退出 → 整个步骤失败。
          if [ -f build/CTestTestfile.cmake ]; then
            ctest --test-dir build --output-on-failure
          else
            echo "ctest: 项目未注册测试（无 CTestTestfile.cmake），已跳过"
          fi

      # ===== 自包含打包 =====
      # 不用 linuxdeployqt，原因（均为其在该场景下的实际失败模式）：
      #   1) 它默认产出 AppImage，需要 FUSE；GitHub runner 无 /dev/fuse，
      #      只能用 --appimage-extract 绕，属非主流路径
      #   2) 上游长期无维护（最后正式版 2019），continuous 构建在
      #      glibc 2.38+ / Qt6 上失败是常态，CI 里不可控
      #   3) 它对 Qt6 的 qml/ 模块目录覆盖不全，而本项目重度依赖
      #      FluentUI 与 QtQuick.Controls，漏目录＝运行时才崩
      # 改为手工收集，行为完全确定，且顺带能做完整性校验：
      #   1) Qt 前缀的 lib/ + plugins/ + qml/ 目录结构固定，整体拷入
      #      （QtXcbQpa 等不在主程序 NEEDED 里、但平台插件要用，
      #       所以不能只按 ldd 挑）
      #   2) libmpv 的 ffmpeg 传递闭包从 libmpv.so.2 出发 BFS 收集，
      #      排除 glibc 与图形/窗口栈（目标机必有，内置反而可能与
      #      本地驱动冲突）
      #   3) 用启动脚本注入 LD_LIBRARY_PATH / 插件与 QML 搜索路径，
      #      无需 patchelf 改 rpath（改 rpath 会与 Qt 自身的
      #      $ORIGIN/../plugins 假设打架）
      - name: Deploy (self-contained Qt + libmpv)
        run: |
          set -euo pipefail
          STAGE="$PWD/stage"
          BIN="$STAGE/bin/BbQ"
          LIBDIR="$STAGE/lib"
          mkdir -p "$LIBDIR"

          echo "--- copying Qt runtime (lib / plugins / qml)"
          cp -a "$QT_PREFIX"/lib/*.so* "$LIBDIR"/
          cp -a "$QT_PREFIX/plugins" "$STAGE/plugins"
          cp -a "$QT_PREFIX/qml" "$STAGE/qml"

          # ---- BbQ 自己的 QML 模块也必须以**文件形式**落到 qml 树里 ----
          # QML_IMPORT_TRACE 实测（银河麒麟）：
          #   locateLocalQmldir: FluentUI module's qmldir found at ".../qml/FluentUI/qmldir"
          #   locateLocalQmldir: BiliQt module's qmldir file not found
          # 即引擎对 import BiliQt 1.0 走的是**文件系统查找**（locateLocalQmldir），
          # 而非 qrc 内嵌资源。qrc:/BiliQt/qmldir 确实存在于二进制中（Windows
          # 构建可验证），但那条路径依赖 qmltyperegistrar 的静态注册生效；
          # Linux 上该注册未起作用，引擎退化到文件系统查找并失败。
          # 后果：qmldir 里的两条 singleton 声明（GlobalState / Theme）读不到，
          # 全部 QML 报 "ReferenceError: GlobalState is not defined"，界面无数据。
          #
          # 修法：把构建树里 qt_add_qml_module 生成的完整模块目录原样拷进
          # qml 树。这与 FluentUI 的部署方式完全一致（已被同一次运行证明有效）。
          # 必须整个 BiliQt/ 目录一起拷——qmldir 里的 type 路径是
          # `qml/GlobalState.qml`（相对模块根），只拷 qmldir 会找不到 QML 本体。
          echo "--- copying BbQ's own QML module (qmldir + qml tree)"
          BILIQT_MODULE_DIR="$(dirname "$(find build -name qmldir -path '*BiliQt/qmldir' | head -1)")"
          if [ -z "$BILIQT_MODULE_DIR" ] || [ ! -d "$BILIQT_MODULE_DIR" ]; then
            echo "ERROR: BiliQt module dir (containing qmldir) not found under build/"; exit 1
          fi
          echo "    module dir: $BILIQT_MODULE_DIR"
          cp -a "$BILIQT_MODULE_DIR" "$STAGE/qml/BiliQt"

          # 部署后自检：qmldir 与 singleton 声明必须在位，否则又是
          # "ReferenceError: GlobalState is not defined"。用 grep 而非 identify
          # 之类外部工具，保持零依赖。
          test -f "$STAGE/qml/BiliQt/qmldir" || {
            echo "ERROR: BiliQt qmldir missing in staged qml tree"; exit 1; }
          grep -q "^singleton GlobalState" "$STAGE/qml/BiliQt/qmldir" || {
            echo "ERROR: qmldir lacks 'singleton GlobalState' declaration"; exit 1; }
          grep -q "^singleton Theme" "$STAGE/qml/BiliQt/qmldir" || {
            echo "ERROR: qmldir lacks 'singleton Theme' declaration"; exit 1; }
          test -f "$STAGE/qml/BiliQt/qml/GlobalState.qml" || {
            echo "ERROR: GlobalState.qml missing beside qmldir"; exit 1; }
          echo "--- staged BiliQt module OK"

          # FluentUI 必须在打包后的 qml 树里，否则启动即找不到 FluWindow
          test -f "$STAGE/qml/FluentUI/qmldir" || {
            echo "ERROR: FluentUI qmldir missing in staged qml tree"; exit 1; }

          # ---- libmpv + ffmpeg 传递依赖 BFS ----
          # 从 libmpv.so.2 出发而非主程序出发：主程序的 ldd 里混着
          # 大量 X11/GL 栈，不该内置
          MPV_SO="$(ldd "$BIN" | awk '/libmpv/ {print $3; exit}')"
          test -n "$MPV_SO" || { echo "ERROR: cannot locate libmpv.so.2"; exit 1; }
          echo "--- libmpv at: $MPV_SO"

          # 种子自身也要拷：它是 BFS 的起点，不会被下面的循环处理。
          # 漏拷会导致产物在无 libmpv 的目标机上启动即失败，而 runner
          # 上因为系统装了 libmpv-dev，ldd 仍然全绿——典型的假绿。
          cp -L "$MPV_SO" "$LIBDIR/$(basename "$MPV_SO")"

          # 排除两类：glibc/运行时本体、图形与窗口系统栈
          DENY='^(linux-vdso|ld-linux|libc\.so|libm\.so|libdl\.so|libpthread\.so|librt\.so|libresolv\.so|libnsl\.so|libutil\.so|libanl\.so|libstdc\+\+|libgcc_s|libGL|libEGL|libGLX|libGLdispatch|libOpenGL|libX11|libXau|libXdmcp|libXext|libxcb|libxshmfence|libdrm|libgbm|libwayland|libxkbcommon)'

          queue=("$MPV_SO"); seen=("$MPV_SO")
          while [ ${#queue[@]} -gt 0 ]; do
            cur="${queue[0]}"; queue=("${queue[@]:1}")
            while IFS= read -r dep; do
              [ -e "$dep" ] || continue
              base="$(basename "$dep")"
              echo "$base" | grep -Eq "$DENY" && continue
              case " ${seen[*]} " in
                *" $dep "*) continue ;;
              esac
              seen+=("$dep")
              cp -L "$dep" "$LIBDIR/$base"
              queue+=("$dep")
            done < <(ldd "$cur" 2>/dev/null | grep -oE '/[^ ]+\.so[^ ]*' || true)
          done
          echo "--- bundled non-Qt libs ($(ls "$LIBDIR" | grep -cv '^libQt6' || true) ):"
          ls "$LIBDIR" | grep -v '^libQt6' || true

          # ---- 启动脚本 ----
          cat > "$STAGE/run-bbq.sh" <<'EOF'
          #!/usr/bin/env bash
          # BbQ 启动脚本：注入自包含运行时环境（Qt 库 / 平台插件 / QML 模块 / libmpv）
          # 用法：./run-bbq.sh [传给 BbQ 的参数]
          set -euo pipefail
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$HERE/plugins"
          export QML2_IMPORT_PATH="$HERE/qml"
          export QML_IMPORT_PATH="$HERE/qml"
          # libmpv 只要求 LC_NUMERIC=C（详见 deb 版启动脚本注释）。
          # 不设 LC_ALL/LANG，避免界面 locale 被改成 C 而退回英文。
          export LC_NUMERIC=C
          # stderr 落地：控制台启动会同时打到终端与日志文件
          LOG_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/BbQ"
          if mkdir -p "$LOG_DIR" 2>/dev/null; then
            exec "$HERE/bin/BbQ" "$@" 2>>"$LOG_DIR/bbq-error.log"
          fi
          exec "$HERE/bin/BbQ" "$@"
          EOF
          chmod 755 "$STAGE/run-bbq.sh"

          cat > "$STAGE/README.txt" <<'EOF'
          BbQ for Linux x64
          ==================

          运行：
              chmod +x run-bbq.sh && ./run-bbq.sh

          目录结构：
              bin/BbQ            主程序
              lib/               Qt 运行库 + libmpv 及其 ffmpeg 依赖
              plugins/           Qt 平台插件（xcb/wayland）与图片解码插件
              qml/               QML 模块（含 FluentUI）
              run-bbq.sh         启动脚本（设置 LD_LIBRARY_PATH 等环境变量）

          目标机要求（未内置）：
              - 图形驱动：mesa（libGL/libEGL），或厂商驱动
              - 窗口系统：X11 或 Wayland
              - Qt xcb 平台插件的运行期依赖（重要）：libxcb-cursor0、
                libxkbcommon-x11-0、libxkbcommon0、libfontconfig1。
                这些**不在主程序的 NEEDED 里**（是插件在运行时 dlopen 的），
                所以 CI 的 ldd 检查发现不了它们。缺 libxcb-cursor0 时
                典型症状是"双击无反应 / 窗口一闪就没了"——Qt6 最经典的
                启动即退原因。Debian/Ubuntu 上执行：
                    sudo apt-get install libxcb-cursor0 libxkbcommon-x11-0
              - Qt Multimedia（可选）：GStreamer 运行时。本项目视频播放
                走 libmpv，不依赖它。
              - glibc >= 2.35（见下方已知限制）

          已知限制：
              - 本包由 CI 无 GUI 会话环境产出，仅验证了编译与链接完整性，
                未做运行期验证。OpenGL 渲染、mpv 帧回调、弹幕渲染表现
                请在真机上确认。
              - glibc >= 2.35。**银河麒麟 V10 是 glibc 2.31，低于此门槛**，
                无法运行。需容器化到 2.28/2.31 基线重新构建才能覆盖。
              - CI 里的 ldd "not found" 检查是弱校验：runner 自带全套
                xcb/图形开发包，该检查在 runner 上几乎必然全绿，不能证明
                目标机不缺库。请以上面"目标机要求"清单为准。
          EOF

          # tar 本身保留权限位，这里再 chmod 一次是双保险
          chmod 755 "$BIN"

      # 打成 tar.gz 而非直接上传目录：actions/upload-artifact 在打包
      # 目录时不保留可执行权限位，解压出来的 BbQ 会变成 -rw-r--r--，
      # 双击即"权限不够"。tar 原样冻结文件系统权限，与 macOS workflow
      # 用 DMG 的动机完全一致。
      - name: Create tarball
        run: |
          set -euo pipefail
          mv stage BbQ-Linux-x64
          tar -czf BbQ-Linux-x64.tar.gz BbQ-Linux-x64
          ls -lh BbQ-Linux-x64.tar.gz
          echo "--- executable bit preserved inside archive:"
          tar -tvzf BbQ-Linux-x64.tar.gz | grep -E 'bin/BbQ|run-bbq.sh'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BbQ-Linux-x64
          path: BbQ-Linux-x64.tar.gz
          # 缩短保留期：artifact 配额与 Packages 共用（Free 500 MB）。
          retention-days: 3

      # ===== .deb 打包 =====
      # 用户诉求原文："我们不能编译成 .deb 文件吗，这样linux 装上后可以像
      # 正常软件一样点击图标运行"。tar.gz 需要手动 chmod + 跑脚本，
      # dpkg -i 之后才有桌面图标、开始菜单项、卸载入口。
      #
      # 与 tar.gz 并存而非替代：tar.gz 是免安装绿色版（另一台机器上直接
      # 解压即用，不碰系统包数据库），两类用户诉求都真实存在。
      #
      # ---- 为什么用 /opt 而不是 /usr ----
      # FHS 规定 /usr 全部归root 且必须能被包管理器安全覆盖。我们把整棵
      # 自包含运行时（Qt + libmpv + ffmpeg 闭包，约 200-400MB）塞进去，
      # 一旦与发行版自带 libqt6core6t64 之类文件重名，apt 的 file conflict
      # 会让卸载/升级 Qt 时连带删掉 BbQ 的文件。/opt/bbq 是"第三方自备
      # 完整运行时"的标准位置，不参与 dpkg 的 file 数据库冲突检测。
      #
      # ---- Depends 的权衡（重要，勿轻易改成"依赖系统 Qt"）----
      # 本项目的 Qt 是**静态内置**在 /opt/bbq/lib 里的（Deploy 步骤从
      # QT_PREFIX 整份拷贝），所以 dpkg 的 Depends 里**不应该**出现
      # libqt6core6t64 / libqt6quick6t64 之类：
      #   - 列了也没用：动态链接器会在 /opt/bbq/lib 里先命中内置的 Qt，
      #     系统装没装 Qt6 完全不影响启动；
      #   - 反而有害：那等于把"用户必须额外装一整套 Qt6"变成硬性前置，
      #     直接违背"装上就能点图标运行"的诉求；
      #   - 更麻烦的是 Qt6 的 t64 过渡包名（time_t 64位）在不同发行版上
      #     命名不同（Ubuntu 24.04 是 libqt6core6t64，23.04 是
      #     libqt6core6，Debian 12/trixie 又切回去了）。列进去会让 deb
      #     在国产 Linux（银河麒麟部分版本基于 Debian 系但包名/版本各异）
      #     上直接装不上，报 "depends on libqt6core6t64, but it is not
      #     installable" —— 这是"装不上"，比"缺库崩溃"更难排查。
      # 结论：只声明**系统必须提供的、我们无法内置也不该内置**的东西：
      #   - libc6 / libstdc++6：GLIBC/GLIBCXX ABI，来自编译器而非 Qt。
      #     我们能内置 libgcc_s/libstdc++，但**故意不内置**：libstdc++
      #     与发行版 C 库耦合较深，内置一份反而在部分系统上与 openssl/
      #     nss 等系统库产生两份符号冲突；且版本号锁定更清晰。
      #   - 图形/窗口栈：libgl1 / libegl1 / libxkbcommon0 —— 内置这些会
      #     和目标机的 mesa / 厂商驱动打架（DRI 驱动是内核模块+用户态
      #     一对一的，混搭会黑屏甚至 X 崩溃），绝对不能内置。
      #   - 字体与字体栈：Qt 的 fontconfig 依赖系统字体枚举，
      #     没有 libfontconfig1 就一个汉字都渲染不出来。
      #   - zlib：libmpv 的 ffmpeg 闭包可能动态需要；内置虽可行但
      #     Depends 声明成本更低（任何桌面系统都有）。
      #
      # ---- 已知限制：glibc 版本（仍未覆盖银河麒麟 V10）----
      # 本 CI 编在 ubuntu-22.04（glibc 2.35）。glibc 是**向后兼容**的：
      # 新宿主提供的一切老系统也有，但**新符号只在新宿主上有**。所以产物
      # 只保证 2.35+ 能跑，更老的系统会在加载时报
      # "version `GLIBC_2.35' not found`（启动即退，控制台一行报错）。
      # ⚠️ 银河麒麟 V10 是 glibc 2.31（部分版本 2.28），**低于本门槛**。
      # 之前这里写的是 (>= 2.38)（编在 24.04），结果 dpkg 在麒麟上直接
      # 拒绝安装——把"装不上"包装成"提前拦住"，比崩溃更难排查。
      # 这不是 Qt 6.9 的限制：Qt 6.9 官方声明支持 Ubuntu 22.04 为基线
      # （glibc 2.28+）；真正的约束是 **install-qt-action 拉取的 aqt
      # 在线安装包构建于 Ubuntu 24.04（glibc 2.39）**，由分发渠道而非
      # Qt 本身决定了产物门槛。要真正覆盖麒麟 V10，需把构建容器化到
      # 2.28/2.31 基线，当前 workflow 做不到——请勿对外承诺支持麒麟 V10。
      - name: Package .deb
        run: |
          set -euo pipefail
          PKGROOT="$PWD/debpkg"
          STAGE="$PWD/BbQ-Linux-x64"   # 上一步 tar 之前的目录，已 mv 到这里

          test -x "$STAGE/bin/BbQ" || { echo "ERROR: staged binary missing"; exit 1; }
          test -d "$STAGE/lib"       || { echo "ERROR: staged lib/ missing"; exit 1; }
          test -d "$STAGE/plugins"   || { echo "ERROR: staged plugins/ missing"; exit 1; }
          test -d "$STAGE/qml"       || { echo "ERROR: staged qml/ missing"; exit 1; }
          test -f "$STAGE/qml/FluentUI/qmldir" || {
            echo "ERROR: FluentUI qmldir missing in staged qml tree"; exit 1; }

          # ---- 1) /opt/bbq：自包含运行时 ----
          mkdir -p "$PKGROOT/opt/bbq"
          cp -a "$STAGE/bin"    "$PKGROOT/opt/bbq/bin"
          cp -a "$STAGE/lib"    "$PKGROOT/opt/bbq/lib"
          cp -a "$STAGE/plugins" "$PKGROOT/opt/bbq/plugins"
          cp -a "$STAGE/qml"    "$PKGROOT/opt/bbq/qml"
          # tar.gz 里的 run-bbq.sh 相对路径写法对 deb 不适用（安装位置
          # 固定在 /opt/bbq），deb 用下面的 /usr/bin/bbqq 绝对路径脚本
          cp -a "$STAGE/mpv.log" "$PKGROOT/opt/bbq/" 2>/dev/null || true

          # ---- 2) /usr/bin/bbqq：绝对路径启动脚本 ----
          # 关键点：全部路径硬编码为 /opt/bbq/...。不能沿用 tar.gz 里
          # 那套 `HERE="$(dirname "${BASH_SOURCE[0]}")"` 相对定位 ——
          # 桌面项的 Exec 直接调 /usr/bin/bbqq，cwd 与启动方式都不可控。
          mkdir -p "$PKGROOT/usr/bin"
          cat > "$PKGROOT/usr/bin/bbqq" <<'EOF'
          #!/bin/sh
          # BbQ 启动脚本（.deb 版）：注入自包含运行时环境
          # 全部使用绝对路径 —— 该脚本由 .desktop 的 Exec 直接调用，
          # 依赖相对路径定位会在 cwd 不可控时失效。
          PREFIX=/opt/bbq
          export LD_LIBRARY_PATH="$PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="$PREFIX/plugins"
          # Qt6 已改用 QML2_IMPORT_PATH → QML_IMPORT_PATH 迁移期双名，
          # 两个都设以免踩不同 Qt 6.x 小版本只认其中一个的坑
          export QML2_IMPORT_PATH="$PREFIX/qml"
          export QML_IMPORT_PATH="$PREFIX/qml"
          # libmpv 硬性要求 LC_NUMERIC=C，否则 mpv_create() 直接返回 nullptr
          # （症状：Non-C locale detected → failed to create mpv context →
          #  播放页空白闪退）。程序内已在 initMpv() 里 setlocale 兜底，这里
          # 再设一道环境变量，使 mpv 依赖的 ffmpeg/Chromium base 同样受益。
          # 只设 LC_NUMERIC，**不要**设 LC_ALL/LANG：那会把界面 locale 一并
          # 改成 C，Qt 界面会退回英文。libmpv 只要求 LC_NUMERIC 为 C。
          export LC_NUMERIC=C
          # mpv 写日志/配置的位置（initMpv 里用 applicationDirPath() +
          # "/mpv-config"，这里指到可写目录；不可写时 mpv 会自己降级，
          # 不会导致启动失败）
          export HOME="${HOME:-$PREFIX}"

          # 从桌面图标启动时 stderr 会被丢弃（.desktop 的 Terminal=false），
          # QML 加载失败这类问题会表现为"界面空白且毫无提示"，极难排查
          # （本次银河麒麟的 GlobalState 报错就是这样查了两轮）。
          # 这里把 stderr 落到用户可写目录，控制台启动时也一并保留。
          LOG_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/BbQ"
          if mkdir -p "$LOG_DIR" 2>/dev/null; then
            exec "$PREFIX/bin/BbQ" "$@" 2>>"$LOG_DIR/bbq-error.log"
          fi
          # 日志目录不可建时不要因此起不来，直接裸 exec
          exec "$PREFIX/bin/BbQ" "$@"
          EOF
          chmod 755 "$PKGROOT/usr/bin/bbqq"

          # ---- 3) 桌面项 ----
          # Icon=bbq 无扩展名：由图标主题查找机制映射到
          # /usr/share/icons/hicolor/256x256/apps/bbq.png（hicolor
          # 是 freedesktop 标准回退主题，任何桌面环境都认）
          mkdir -p "$PKGROOT/usr/share/applications"
          cat > "$PKGROOT/usr/share/applications/bbq.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=BbQ
          GenericName=Bilibili 视频播放器
          Comment=面向 B 站 的 Qt/QML 视频客户端
          Exec=/usr/bin/bbqq
          Icon=bbq
          Terminal=false
          Categories=AudioVideo;Video;Player;
          Keywords=Bilibili;B站;视频;播放器;
          StartupNotify=true
          StartupWMClass=BbQ
          EOF
          chmod 644 "$PKGROOT/usr/share/applications/bbq.desktop"

          # ---- 4) 图标：res/app.ico → 256x256 png ----
          # 【为什么不用 ImageMagick —— 踩过的坑，勿改回】
          # .ico 是多图层容器（16/32/48/64/128/256），要拿到 256 那层。
          # 曾用 `convert -define icon:auto-resize=256 ...`，这是
          # **ImageMagick 7 专有语法**；而 Ubuntu 22.04 的 `imagemagick`
          # 元包提供的是 **IM6**（6.9.x，命令落在 convert-im6.q16 /
          # identify-im6.q16，经 alternatives 指向 convert/identify）。
          # IM6 遇到不认识的 `-define` **不报错、直接静默忽略** → 产物根本没
          # 生成，CI 要等到后面的尺寸断言才炸，且错误信息指向"多图层提取
          # 失败"这种误导性原因。（索引语法 `app.ico[5]` 在 IM6/IM7 之间
          # 行为同样不一致，也不能依赖。）
          # 已经因为"照抄文档 / 换版本就失效"踩坑两次（aqt 的 `gcc_64`
          # vs `linux_gcc_64`、这次的 `icon:auto-resize`），故彻底移出
          # 对 ImageMagick 的依赖。
          #
          # 改为零依赖的 Python 直接解析 ICO 容器：
          # .ico 的 256 那层本身就是**内嵌的完整 PNG**（本仓库 res/app.ico
          # 实测layer5 魔数为 89 50 4E 47），按 dwBytesInRes/dwImageOffset
          # 取出字节流即为合法 PNG；万一某次重新导出 .ico 导致 256 层变成
          # BMP/DIB，脚本内置 DIB→PNG 转换兜底。两条分支都有单测覆盖
          # （scripts/make-test-ico.py 造样本，scripts/verify-png.py 校验）。
          command -v python3 >/dev/null 2>&1 || {
            echo "ERROR: python3 not found (required for ICO extraction)"; exit 1; }

          mkdir -p "$PKGROOT/usr/share/icons/hicolor/256x256/apps"
          ICON_PNG="$PKGROOT/usr/share/icons/hicolor/256x256/apps/bbq.png"
          python3 scripts/extract-ico-png.py res/app.ico "$ICON_PNG"

          # 断言产出真的是 256x256 的合法 PNG。用 Python 读 IHDR 而**不用**
          # `identify`：identify 是 IM6/IM7 双版本命令，输出格式与可用性
          # 都随版本变化，重新引入对 IM 的依赖就等于回到上面的坑。
          # verify-png.py 会逐 chunk 校验 CRC、按 PNG 规范逐行解码扫描线
          # （能抓住"结构合法但内容错位"的静默失败），并检查非全透明。
          python3 scripts/verify-png.py "$ICON_PNG" 256 256

          # ---- 5) DEBIAN/control ----
          # libc6 下限必须与 runner 的 glibc 严格对齐：CI 在 22.04（2.35）上编，
          # 产物就只保证 2.35+ 能跑。把版本写进 Depends 的目的是让 dpkg 在
          # **安装前**就明确报错并拒绝，而不是装完点击图标才在 loader 里崩。
          # 反面教训：曾写成 (>= 2.38)，结果在银河麒麟 V10（glibc 2.31）上
          # dpkg 直接拒绝安装——把"用户装不上"包装成了"我们提前拦住了"，
          # 比运行时崩溃更难排查。改动 runner 时这里必须同步改。
          mkdir -p "$PKGROOT/DEBIAN"
          cat > "$PKGROOT/DEBIAN/control" <<'EOF'
          Package: bbq
          Version: 1.0.0
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: BbQ Contributors <bbq@example.invalid>
          Depends: libc6 (>= 2.35), libstdc++6, libgcc-s1, zlib1g, libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libxcb-cursor0, libfontconfig1, libfreetype6, libdbus-1-3
          Description: B 站视频播放器（Qt6 + QML + libmpv）
           BbQ 是一个面向 B 站 的桌面视频客户端，使用 Qt6/QML 构建界面，
           libmpv 负责视频解码与渲染，支持视频点播与直播播放。
           .
           本包自带 Qt 运行库、QML 模块与 libmpv 及其 ffmpeg 依赖
           （安装在 /opt/bbq），因此不依赖系统预装 Qt6。
           仅需系统提供图形驱动、窗口系统与 glibc。
          EOF
          chmod 644 "$PKGROOT/DEBIAN/control"

          # ---- 6) 构建 + 基本校验 ----
          dpkg-deb --build --root-owner-group "$PKGROOT" BbQ-Linux-amd64.deb
          ls -lh BbQ-Linux-amd64.deb

          echo "--- package metadata:"
          dpkg-deb --info BbQ-Linux-amd64.deb | sed -n '1,20p'
          echo "--- installed tree summary:"
          dpkg-deb --contents BbQ-Linux-amd64.deb \
            | grep -E 'usr/bin/|usr/share/applications/|usr/share/icons/|opt/bbq/bin/|DEBIAN' \
            || true

          # ---- 7) 针对"装上但点不开"的静态断言 ----
          # 这些检查能在 CI 里就抓到绝大多数"dpkg 装成功但运行失败"的
          # 结构性原因，不必等用户回报。
          #   a) 权限位：deb 会冻结权限位，写错的话 /usr/bin/bbqq 不可执行，
          #      dpkg -i 不报错、桌面点击报 "Failed to execute"
          test -x "$PKGROOT/usr/bin/bbqq" || { echo "ERROR: bbqq not executable"; exit 1; }
          test -x "$PKGROOT/opt/bbq/bin/BbQ" || { echo "ERROR: BbQ not executable"; exit 1; }
          #   b) desktop 文件里的路径必须真实存在（Exec 指错 → 静默点不开）
          grep -q '^Exec=/usr/bin/bbqq$' "$PKGROOT/usr/share/applications/bbq.desktop" || {
            echo "ERROR: desktop Exec mismatch"; exit 1; }
          test -f "$PKGROOT/usr/share/icons/hicolor/256x256/apps/bbq.png" || {
            echo "ERROR: desktop icon missing"; exit 1; }
          #   c) 启动脚本引用的每个目录都要在包里
          for d in lib plugins qml; do
            test -d "$PKGROOT/opt/bbq/$d" || { echo "ERROR: /opt/bbq/$d missing"; exit 1; }
          done
          #   d) FluentUI 必须在内置 qml 树里，否则启动即找不到 FluWindow
          test -f "$PKGROOT/opt/bbq/qml/FluentUI/qmldir" || {
            echo "ERROR: FluentUI qmldir missing in deb qml tree"; exit 1; }

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: BbQ-Linux-amd64-deb
          path: BbQ-Linux-amd64.deb
          # 缩短保留期：artifact 配额与 Packages 共用（Free 500 MB）。
          retention-days: 3