# Windows 每次推送自动编译 BbQ（MinGW，与本地 Qt 6.11.1 环境一致）
#
# 产物：BbQ-Windows-x64.zip 绿色版（exe + Qt dll + mpv.dll + FluentUI 插件），
# 解压即用，免本地配置——用于快速分发给别人测试。
#
# 依赖说明：
#   - Qt 6.11.1 win64_mingw + Qt 配套 MinGW 13.1（aqt 手动安装）
#   - libmpv 已内置仓库 third_party/mpv-dev（含 #17764 D3D11 补丁，
#     头文件/导入库 + runtime 全量依赖 DLL），无需外部下载
#   - FluentUI 官方仓库现编译（本地无改动），安装进 Qt 的 qml 目录
#
# 注意：runner 上 MinGW 与本地 Qt 官方 MinGW 版本可能存在小版本差异，
# 若出现本地能编、CI 报错的情况，优先比对 gcc 版本

name: Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- QML 自定义类型 import 静态审计（无需 Qt，纯 python3）----
      # 为什么必须放在 Windows CI（每次 push 自动触发）而不是只在 Linux：
      # Linux workflow 是 workflow_dispatch 手动触发，跑不到；挂在这里
      # 等于每次提交都免费做一次全量 QML import 审计。
      #
      # 为什么需要它（这不是形式检查）：
      # **qmlcachegen 是纯字节码编译器，不做类型解析。** QML 文件缺少某个
      # 自定义类型的 import 时，qmlimportscanner / qmlcachegen 依然会成功
      # 生成 AOT 代码、编译、链接 —— 全绿。我们做过负向对照实验：删掉
      # qml/pages/LivePlayerPage.qml 的 `import "../components"`（该文件用
      # 了 components/DanmakuOverlay.qml）后重新全量编译，9/9 全部成功、
      # 退出码 0、AOT 产物照常生成。也就是说：
      #     **Windows 编译通过 不能证明 QML 能在运行时加载。**
      # 这类错误只会在运行时暴露（"Type X unavailable" / "X is not a
      # type"），且报错指向类型**使用处**而非 import 处，极难定位。
      # 实际后果：LivePlayerPage 的断链在 Linux 上暴露，而 Windows 上靠
      # 隐式作用域恰好能跑 —— 同一份代码两平台表现不同。
      # 这个静态审计是目前唯一能在 CI 里拦住该类错误的手段。
      #
      # 退出码非 0 即失败（脚本发现任一文件的自定义类型无法解析时返回 1）。
      - name: Audit QML imports (static)
        shell: pwsh
        run: |
          # windows-latest 自带真实 Python（Store 的python.exe 存根不算，
          # 会以9009 退出）。先断言解释器可用，避免"脚本没跑"被误当成
          # "审计通过"——那正是本步骤最危险的失败模式。
          python -c "import sys; print(sys.version)"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "python not available on runner; cannot run QML import audit"
            exit 1
          }

          python scripts/audit-qml-imports.py qml
          if ($LASTEXITCODE -ne 0) {
            Write-Error "QML import audit failed: some custom types cannot be resolved (see output above)"
            exit 1
          }
          Write-Host "QML import audit passed"

      # install-qt-action 的 aqtversion 参数只接受版本号，无法安装 git 依赖，
      # 故手动安装含 Qt 6.11 扁平仓库结构修复的 aqtinstall（上游 bug #1007 / PR #1000），
      # 再手动执行 aqt 安装 Qt；官方发布 3.4 后可改回 `pip install "aqtinstall==3.4.*"`
      - name: Install aqtinstall (PR#1000, Qt 6.11 repo layout fix)
        shell: pwsh
        run: python -m pip install --upgrade "git+https://github.com/miurahr/aqtinstall.git@refs/pull/1000/head"

      - name: Install Qt 6.11.1 (MinGW 64-bit)
        shell: pwsh
        run: |
          $qtDir = "$env:GITHUB_WORKSPACE\Qt"
          python -m aqt install-qt windows desktop 6.11.1 win64_mingw `
            --outputdir $qtDir `
            --modules qtshadertools qtmultimedia qtwebsockets qt5compat qtimageformats
          # 必须使用 Qt 配套的 MinGW 13.1（与本地 D:\Qt\Tools\mingw1310_64 一致）：
          # runner 预装的 MSYS2 MinGW 15.2 CRT 与 Qt 预编译的 libQt6EntryPoint.a
          # 不兼容（undefined reference to `__imp___argc`）
          python -m aqt install-tool windows desktop tools_mingw1310 --outputdir $qtDir
          # Qt bin 与配套 MinGW bin 入 PATH（GITHUB_PATH 写入的目录会排在
          # 系统预装的 C:\mingw64 之前）
          Add-Content $env:GITHUB_PATH "$qtDir\6.11.1\mingw_64\bin"
          Add-Content $env:GITHUB_PATH "$qtDir\Tools\mingw1310_64\bin"
          Get-ChildItem "$qtDir\6.11.1\mingw_64\bin" -Filter "*.exe" |
            Select-Object -First 5 | ForEach-Object { $_.Name }

      - name: Verify toolchain
        shell: pwsh
        run: |
          # 打印工具链版本供日志核对（应为 MinGW 13.1.x，而非系统的 15.2）
          gcc --version
          qmake -query QT_INSTALL_PREFIX
          qmake -query QT_INSTALL_QML
          echo "QT_PREFIX=$(qmake -query QT_INSTALL_PREFIX)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "QT_QML_DIR=$(qmake -query QT_INSTALL_QML)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build FluentUI
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/zhuzichu520/FluentUI.git $env:RUNNER_TEMP\FluentUI
          cmake -S $env:RUNNER_TEMP\FluentUI -B $env:RUNNER_TEMP\FluentUI\build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" `
            -DFLUENTUI_BUILD_EXAMPLES=OFF
          cmake --build $env:RUNNER_TEMP\FluentUI\build --parallel
          # FluentUI 构建时把插件直接链入 Qt 的 qml 目录，无需 install
          $qmlDir = "$env:QT_QML_DIR\FluentUI"
          if (-not (Test-Path "$qmlDir\qmldir")) {
            New-Item -ItemType Directory -Force -Path $qmlDir | Out-Null
            Get-ChildItem "$env:RUNNER_TEMP\FluentUI\build" -Recurse -Filter "qmldir" |
              ForEach-Object { Copy-Item $_.FullName $qmlDir -Force }
          }
          if (-not (Test-Path "$qmlDir\qmldir")) { throw "FluentUI qmldir not found" }

      - name: Configure (Release)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" `
            -DFLUENTUI_QML_PATH="$env:QT_QML_DIR\FluentUI"

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Deploy (windeployqt)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "BbQ.exe" | Select-Object -First 1
          if (-not $exe) { throw "BbQ.exe not found in build tree" }
          $binDir = $exe.DirectoryName
          echo "BIN_DIR=$binDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          windeployqt --release --qmldir qml "$($exe.FullName)"
          # 拷贝 libmpv 运行库及其 ffmpeg 全家桶依赖（仓库内置 third_party/mpv-dev）
          Copy-Item "third_party\mpv-dev\lib\mpv-2.dll" $binDir -Force
          Copy-Item "third_party\mpv-dev\runtime\*.dll" $binDir -Force
          Get-ChildItem $binDir | ForEach-Object { $_.Name }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BbQ-Windows-x64
          path: ${{ env.BIN_DIR }}
          retention-days: 14
