vf=
# hr-seek=no：seek 跳到最近关键帧，不做精确解码定位。
# 必须显式写 no —— mpv 默认是 default，而 default 对"向前 seek"
# （也就是用户快进/拖进度条最常做的方向）仍然启用精确 seek，会要求
# demuxer 从网络读到目标位置并解码到精确帧；DASH 是两条独立 HTTP 流，
# 连续快进时容易把 core 线程堵在网络 read 上（表现为进度条卡死、拖动
# 无响应，见 2026-10-30 日志）。代价是定位可能偏 1~2 秒（一个 GOP），
# 想精确定位就改回 hr-seek=yes 或删掉这行（回到 default）。
hr-seek=no
scale=bilinear
cscale=bilinear
dscale=bilinear
dither-depth=auto
dither=fruit
deband=yes
video-sync=display-resample
